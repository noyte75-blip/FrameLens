[build]
  publish = "public"
  command = "echo 'Site estático pronto para publicar'"
[functions]
  directory = "netlify/functions"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200
